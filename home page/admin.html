<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Muhammed Eren Aydin</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="login-icon">
          <i class="fas fa-lock"></i>
        </div>
        <h2>Admin Girişi</h2>
        <form
          id="login-form"
          class="login-form"
          onsubmit="handleLogin(event); return false;"
        >
          <div class="input-group">
            <i class="fas fa-key input-icon"></i>
            <input
              type="password"
              id="admin-password"
              class="admin-input"
              placeholder="Admin şifresi"
              required
              autocomplete="off"
            />
          </div>
          <button
            type="submit"
            class="login-btn"
            onclick="handleLogin(event); return false;"
          >
            <i class="fas fa-sign-in-alt"></i> Giriş Yap
          </button>
          <div id="login-message" class="form-message"></div>
        </form>
      </div>
    </div>

    <!-- ================= ADMIN PANEL ================= -->
    <div id="admin-panel" class="admin-panel" style="display: none">
      <!-- Navigation -->
      <nav class="admin-nav">
        <div class="admin-nav-content">
          <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
          <button id="logout-btn" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Çıkış
          </button>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="admin-content">
        <section class="admin-section">
          <h2><i class="fas fa-envelope"></i> Newsletter Kayıtları</h2>

          <div class="stats-cards">
            <div class="stat-card">
              <div class="stat-icon">
                <i class="fas fa-users"></i>
              </div>
              <div class="stat-info">
                <h3 id="total-count">0</h3>
                <p>Toplam Kayıt</p>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">
                <i class="fas fa-calendar-day"></i>
              </div>
              <div class="stat-info">
                <h3 id="today-count">0</h3>
                <p>Bugünkü Kayıt</p>
              </div>
            </div>
          </div>

          <div class="table-controls">
            <button id="refresh-btn" class="refresh-btn">
              <i class="fas fa-sync-alt"></i> Yenile
            </button>
            <button id="export-btn" class="export-btn">
              <i class="fas fa-download"></i> CSV İndir
            </button>
            <button
              id="test-btn"
              class="test-btn"
              style="
                background: rgba(255, 165, 0, 0.2);
                border-color: rgba(255, 165, 0, 0.3);
                color: #ffaa00;
              "
            >
              <i class="fas fa-bug"></i> Test (Console)
            </button>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th><i class="fas fa-envelope"></i> E-posta</th>
                  <th><i class="fas fa-calendar"></i> Tarih</th>
                  <th><i class="fas fa-clock"></i> Saat</th>
                </tr>
              </thead>
              <tbody id="data-table-body">
                <tr>
                  <td colspan="4" class="loading-row">
                    <i class="fas fa-spinner fa-spin"></i> Veriler yükleniyor...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script>
      // Admin şifresi - global erişim için
      window.ADMIN_PASSWORD = "admin123";
    </script>
    <script src="admin.js"></script>
  </body>
</html>
